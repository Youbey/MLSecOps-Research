version: '3.8'

services:
  # FL Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_server
    environment:
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - ./server.py:/app/server.py
      - server_state:/app/state
    command: python server.py
    networks:
      - fl_network
    labels:
      - "job=fl_server"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FL Client 1
  client_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_client_1
    environment:
      - CLIENT_ID=client_1
      - SERVER_URL=http://server:5000
      - DATA_FILE=/data/client_1_data.json
    volumes:
      - ./client.py:/app/client.py
      - ./data:/data
      - client_1_cache:/app/cache
    depends_on:
      server:
        condition: service_healthy
    networks:
      - fl_network
    labels:
      - "job=fl_client"
      - "client_id=client_1"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
    command: python client.py

  # FL Client 2
  client_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_client_2
    environment:
      - CLIENT_ID=client_2
      - SERVER_URL=http://server:5000
      - DATA_FILE=/data/client_2_data.json
    volumes:
      - ./client.py:/app/client.py
      - ./data:/data
      - client_2_cache:/app/cache
    depends_on:
      server:
        condition: service_healthy
    networks:
      - fl_network
    labels:
      - "job=fl_client"
      - "client_id=client_2"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
    command: python client.py

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: fl_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fl_network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"

  # Loki for logs
  loki:
    image: grafana/loki:latest
    container_name: fl_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fl_network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: fl_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    depends_on:
      - prometheus
      - loki
    networks:
      - fl_network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"

volumes:
  server_state:
  client_1_cache:
  client_2_cache:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  fl_network:
    driver: bridge