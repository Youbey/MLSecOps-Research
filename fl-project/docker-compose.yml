version: '3.8'

services:
  # FL Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_server
    environment:
      - FLASK_ENV=production
    ports:
      - "5000:5000"
      - "9090:9090"
    volumes:
      - ./server.py:/app/server.py
      - server_state:/app/state
    command: python server.py
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FL Client 1
  client_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_client_1
    environment:
      - CLIENT_ID=client_1
      - SERVER_URL=http://server:5000
      - DATA_FILE=/data/client_1_data.json
    volumes:
      - ./client.py:/app/client.py
      - ./data:/data
      - client_1_cache:/app/cache
    depends_on:
      server:
        condition: service_healthy
    networks:
      - fl_network
    command: python client.py

  # FL Client 2
  client_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_client_2
    environment:
      - CLIENT_ID=client_2
      - SERVER_URL=http://server:5000
      - DATA_FILE=/data/client_2_data.json
    volumes:
      - ./client.py:/app/client.py
      - ./data:/data
      - client_2_cache:/app/cache
    depends_on:
      server:
        condition: service_healthy
    networks:
      - fl_network
    command: python client.py

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: fl_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fl_network

volumes:
  server_state:
  client_1_cache:
  client_2_cache:
  prometheus_data:

networks:
  fl_network:
    driver: bridge
