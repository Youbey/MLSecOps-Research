version: '3.8'

networks:
  # Connect to the EXISTING network created by infra
  fl_network:
    external: true
    name: fl-project_fl_network

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_server
    ports:
      - "5000:5000"
    volumes:
      - ./server.py:/app/server.py
      - ./audit:/app/audit
    command: python server.py
    networks:
      - fl_network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"

  client_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_client_1
    environment:
      - CLIENT_ID=client_1
      - SERVER_URL=http://server:5000
      - DATA_FILE=/data/client_1_data.json
    volumes:
      - ./client.py:/app/client.py
      - ./data:/app/data
    command: python client.py
    networks:
      - fl_network
    depends_on:
      - server
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"

  malicious_client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_malicious_client
    environment:
      - CLIENT_ID=malicious_client
      - SERVER_URL=http://server:5000
      - DATA_FILE=/data/malicious_client_data.json
      - ATTACK_MODE=${ATTACK_MODE:-NONE}
    volumes:
      - ./malicious_client.py:/app/malicious_client.py
      - ./data:/app/data
    command: python malicious_client.py
    networks:
      - fl_network
    depends_on:
      - server
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"