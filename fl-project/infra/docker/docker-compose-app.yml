version: '3.8'

networks:
  # Connect to the EXISTING network created by infra
  fl_network:
    external: true
    name: fl-project_fl_network

services:
  server:
    build:
      context: ../../
      dockerfile: fl-project/infra/docker/Dockerfile
    container_name: fl_server
    ports:
      - "5000:5000"
    volumes:
      - ../../fl-project/src:/app/src
      - ../../fl-project/src/utils:/app/src/utils
      - ../../fl-project/src/data:/app/data
    working_dir: /app/src
    command: python server.py
    networks:
      - fl_network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"

  client_1:
    build:
      context: ../../
      dockerfile: fl-project/infra/docker/Dockerfile
    container_name: fl_client_1
    environment:
      - CLIENT_ID=client_1
      - SERVER_URL=http://server:5000
      - DATA_FILE=/app/data/client_1_data.json
    volumes:
      - ../../fl-project/src:/app/src
      - ../../fl-project/src/utils:/app/src/utils
      - ../../fl-project/src/data:/app/data
    working_dir: /app/src
    command: python client.py
    networks:
      - fl_network
    depends_on:
      - server
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"

  malicious_client:
    build:
      context: ../../
      dockerfile: fl-project/infra/docker/Dockerfile
    container_name: fl_malicious_client
    environment:
      - CLIENT_ID=malicious_client
      - SERVER_URL=http://server:5000
      - DATA_FILE=/app/data/malicious_client_data.json
      - ATTACK_MODE=${ATTACK_MODE:-NONE}
    volumes:
      - ../../fl-project/src:/app/src
      - ../../fl-project/src/utils:/app/src/utils
      - ../../fl-project/src/data:/app/data
    working_dir: /app/src
    command: python malicious_client.py
    networks:
      - fl_network
    depends_on:
      - server
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"