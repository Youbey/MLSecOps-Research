version: '3.8'

networks:
  fl_network:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fl_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - fl_network

  loki:
    image: grafana/loki:latest
    container_name: fl_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fl_network

  pushgateway:
    image: prom/pushgateway
    container_name: fl_pushgateway
    ports:
      - "9092:9091" # External 9092, Internal 9091
    networks:
      - fl_network

  grafana:
    image: grafana/grafana:latest
    container_name: fl_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      # Mount the JSON dashboard so it appears automatically
      - ./grafana/provisioning/dashboards/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/grafana-dashboard.json
    networks:
      - fl_network